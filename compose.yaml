x-playwright-service: &playwright-service
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    - .:/app
    - /app/node_modules
  deploy:
    resources:
      limits:
        memory: 2G
      reservations:
        memory: 1G
  environment:
    - CI=true

services:
  playwrightTests:
    <<: *playwright-service
    command: npx playwright test

  uiTests:
    <<: *playwright-service
    command: npx playwright test --grep @ui --reporter=html

  apiTests:
    <<: *playwright-service
    command: npx playwright test --grep @api --reporter=html

  webtablesTests:
    <<: *playwright-service
    command: npx playwright test --grep @webTables --reporter=html

  chromiumTests:
    <<: *playwright-service
    command: npx playwright test --project=chromium --reporter=html

  firefoxTests:
    <<: *playwright-service
    command: npx playwright test --project=firefox --reporter=html
