name: Run Tests

on:
  schedule:
    - cron: "0 7 * * 1-5" # Every Monday to Friday at 07:00 UTC
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.group.name }} - ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group:
          - name: api
            tag: "@api"
          - name: ui
            tag: "@ui"
          - name: webtables
            tag: "@webTables"
          - name: a11y
            tag: "@a11y"
        browser: [chromium, firefox]
        exclude:
          - group:
              name: api
            browser: firefox
          # The analyzer inspects the DOM, not rendering, so a second engine adds runtime
          # without adding signal. Verified identical on chromium/firefox/webkit.
          - group:
              name: a11y
            browser: firefox

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run ${{ matrix.group.name }} Tests
        run: |
          npx playwright test \
            --grep '${{ matrix.group.tag }}' \
            --project=${{ matrix.browser }}

      - name: Upload Blob Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blobReport-${{ matrix.group.name }}-${{ matrix.browser }}
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwrightResults-${{ matrix.group.name }}-${{ matrix.browser }}
          # playwright-report/ and reports/ come from the html/json/junit reporters, which
          # run only locally — CI uses list + blob + the GitHub Actions reporter. The blob
          # report has its own upload step above; what is left worth keeping here is
          # test-results/: traces, screenshots and videos, all produced only on failure.
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30

  # Responsive testing job for UI tests
  responsiveTests:
    name: Responsive - ${{ matrix.viewport }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - viewport: mobileChrome
            browser: chromium
          - viewport: tablet
            browser: webkit

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run UI Tests - ${{ matrix.viewport }}
        run: |
          npx playwright test \
            --grep '@ui' \
            --project=${{ matrix.viewport }}

      - name: Upload Blob Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blobReportResponsive-${{ matrix.viewport }}
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Responsive Test Artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwrightResultsResponsive-${{ matrix.viewport }}
          # playwright-report/ and reports/ come from the html/json/junit reporters, which
          # run only locally — CI uses list + blob + the GitHub Actions reporter. The blob
          # report has its own upload step above; what is left worth keeping here is
          # test-results/: traces, screenshots and videos, all produced only on failure.
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30

  # Merge and publish reports
  mergeReports:
    name: Merge Test Reports
    needs: [test, responsiveTests]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Download Blob Reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: allBlobReports
          pattern: blobReport*
          merge-multiple: true

      - name: Merge Reports
        run: npx playwright merge-reports --config=playwright.merge.config.js ./allBlobReports

      - name: Upload Final Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: finalTestReport
          path: reports/final/
          if-no-files-found: warn
          retention-days: 30
