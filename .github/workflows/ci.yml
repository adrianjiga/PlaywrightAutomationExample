name: Run CI
permissions:
  contents: read
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Linter
        run: npm run lint

      - name: Format Code Check
        run: npm run format:check

      # Not previously in CI, which is why a TypeScript 7 breaking change sat unnoticed on
      # main: tsc removed `baseUrl`, and nothing ran tsc.
      - name: Typecheck
        run: npm run typecheck

      - name: Run smoke tests
        run: npx playwright test --grep @smoke --project=chromium

      # `playwright-report/` is written by the *html* reporter, which this project uses only
      # locally — CI runs `list` + `blob` + the GitHub Actions reporter (see
      # playwright.config.js), so that directory never exists here and the step warned
      # "No files were found" on every green run. `blob-report/` is what CI actually
      # produces, and it is the useful one: `playwright merge-reports` turns it into HTML.
      #
      # `test-results/` holds traces, screenshots, and videos, all of which are configured
      # to appear only on failure or retry — so on a green run it is legitimately empty.
      # `if-no-files-found: ignore` keeps that from being reported as a problem.
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwrightReportCi
          path: |
            blob-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
